name: Update Kumo

# Daily and on demand: generate the registry from the latest Kumo release,
# install every item into fresh Vite and Next.js apps with the real shadcn
# CLI, and commit to main only if all of that passes. Pull requests that
# touch the generator run the same checks without publishing.
#
# The generate and verify jobs run third-party code (npm installs and
# builds) with a read-only token. Only the publish job can write, and it
# only commits the files the generate job produced.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      kumo_tag:
        description: "Kumo release tag to build from (default: the latest @cloudflare/kumo@x.y.z release)"
        required: false
  pull_request:
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "registry/icon-placeholder.tsx"
      - ".github/workflows/update.yml"

permissions: {}

concurrency:
  group: update-kumo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Install scripts stay off: a freshly published package never runs code here.
      - run: npm ci --ignore-scripts

      # Kumo's source is only parsed (TypeScript compiler API, PostCSS), never run.
      - name: Fetch the Kumo release
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          KUMO_TAG: ${{ inputs.kumo_tag }}
        run: echo "tag=$(scripts/fetch-kumo.sh .kumo)" >> "$GITHUB_OUTPUT"

      # Fails on an unmapped icon, an unknown import, a type error or a shim
      # that doesn't compile for one of the five icon libraries.
      - name: Generate, build and check
        run: npm run registry

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: |
            registry.json
            registry/
            public/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - vite lucide kumo-theme default
          - vite hugeicons kumo-binding default
          - vite tabler kumo-cloudflare custom-aliases
          - next lucide kumo-binding default
          - next hugeicons kumo-cloudflare default
          # One item on its own, as users add them (input and input-group
          # depend on each other).
          - vite lucide kumo-binding default input
          - vite lucide kumo-cloudflare default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry

      # shadcn init + add every item + tsc --noEmit + production build, and for
      # Vite apps with kumo-theme / kumo-cloudflare, hover and selected
      # backgrounds in a real browser (the runner's Chrome).
      - name: Install every item into a fresh app (${{ matrix.app }})
        env:
          CHROMIUM: google-chrome
        run: scripts/verify.sh ${{ matrix.app }}

  publish:
    needs: [generate, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replace the registry with the verified one
        run: rm -rf registry/kumo public/r registry.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.generate.outputs.tag }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Registry is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A registry.json registry public
          git commit -m "chore: regenerate the registry from kumo ${TAG##*@}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:main
